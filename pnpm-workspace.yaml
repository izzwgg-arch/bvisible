packages:
  - "apps/*"
  - "packages/*"

# Allow these packages to run install scripts. Prisma needs to fetch engines,
# sharp compiles native code, unrs-resolver compiles a Rust binding, and
# esbuild downloads its prebuilt binary via a postinstall script (tsx pulls
# it in for the bootstrap CLI in apps/web/scripts/). Without these,
# pnpm v11 refuses to run install scripts and exits non-zero on the deploy.
# Field name confirmed by `pnpm approve-builds --all` writing here.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
