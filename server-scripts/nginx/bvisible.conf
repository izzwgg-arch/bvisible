# B Visible — production reverse proxy.
#
# Source of truth: server-scripts/nginx/bvisible.conf in the repo.
# Installed at:    /etc/nginx/sites-available/bvisible
# Enabled via:     /etc/nginx/sites-enabled/bvisible -> ../sites-available/bvisible
#
# This file is HTTP-only by intent. After certbot --nginx succeeds it will
# add a parallel `server { listen 443 ssl http2; ... }` block in place AND
# (with --redirect) inject a 301 to HTTPS in the :80 server block below.
# Do NOT hand-edit the certbot-managed lines — re-run certbot instead.

upstream bvisible_web {
    # Node app is bound to localhost only; never exposed publicly. UFW
    # additionally blocks :3000 from the outside.
    server 127.0.0.1:3000;
    keepalive 32;
}

# WebSocket upgrade map. Required for any future SSE / WebSocket route.
# Lives at http{} scope (sites-enabled is included inside http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80 default_server;
    listen [::]:80 default_server;

    # vmi3270817.contaboserver.net is the cert hostname so certbot can find
    # this block by name; `_` keeps it catch-all for unknown Host headers.
    server_name vmi3270817.contaboserver.net _;

    access_log /var/log/nginx/bvisible.access.log;
    error_log  /var/log/nginx/bvisible.error.log warn;

    # Reasonable upload limit. Bumped per feature need; not generous on purpose.
    client_max_body_size 25m;

    # gzip text-ish responses only. Images/PDFs are already compressed.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Security headers. HSTS is intentionally NOT set here — only enable HSTS
    # once HTTPS is verified-stable (HSTS is a one-way commitment).
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header X-Frame-Options        "SAMEORIGIN"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # microphone=(self), NOT microphone=() — the assistant dock records voice
    # notes from this origin. An empty allowlist disables the mic at the
    # protocol level, so Chrome reports the permission as denied no matter what
    # the operator has allowed in site settings, and the dock can only tell
    # them to fix a browser setting that was never the problem.
    add_header Permissions-Policy     "camera=(), microphone=(self), geolocation=()" always;

    # ACME challenge dir — must stay reachable on :80 even after HTTPS is up
    # so certbot renewals (--nginx) keep working.
    location /.well-known/acme-challenge/ {
        root      /var/www/html;
        try_files $uri =404;
    }

    # Next.js immutable static assets. Long-cache; still proxied (not served
    # from disk) so a deploy that changes asset hashes is automatically
    # consistent without nginx config changes.
    location /_next/static/ {
        proxy_pass         http://bvisible_web;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        expires            1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else proxies to the Node app.
    location / {
        proxy_pass         http://bvisible_web;
        proxy_http_version 1.1;

        # Forwarded / real-IP headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Sensible timeouts. Keep connect tight; allow longer reads for SSE.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disable buffering so streaming responses (SSE) reach the client live.
        proxy_buffering off;
    }
}
