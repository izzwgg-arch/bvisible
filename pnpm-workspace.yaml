packages:
  - "apps/*"
  - "packages/*"

# Allow these packages to run install scripts. Prisma needs to fetch engines,
# sharp compiles native code, unrs-resolver compiles a Rust binding. Without
# this, pnpm v11 refuses to run their install scripts and exits non-zero.
# Field name confirmed by `pnpm approve-builds --all` writing here.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
